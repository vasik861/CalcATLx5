<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkTheLive | Структуры x5</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .el__logo{
            text-align: center;
            margin-bottom: 10px;
        }
        .el__logo img{
            width: 300px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #2c2c2c;
            border-radius: 4px;
            margin: 5px;
            transition: background 0.3s;
            color: #e0e0e0;
        }
        .tab.active {
            background: #7c4dff;
            color: #121212;
        }
        .tab:hover {
            background: #3a3a3a;
        }
        .content {
            display: none;
        }
        .content.active {
            display: block;
        }
        .searchable {
            position: relative;
        }
        .searchable input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 16px;
            background: #2c2c2c;
            color: #e0e0e0;
            box-sizing: border-box;
        }
        .searchable select {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 16px;
            background: #2c2c2c;
            color: #e0e0e0;
        }
        .output {
            padding: 15px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #2c2c2c;
            margin-top: 10px;
        }
        .output-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }
        .output-item:last-child {
            border-bottom: none;
        }
        .output-item strong {
            color: #7c4dff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            color: #e0e0e0;
        }
        table th, table td {
            border: 1px solid #444;
            padding: 8px;
            text-align: left;
        }
        table th {
            background: #7c4dff;
            font-weight: 500;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        .converter-form {
            background: #1e1e1e;
            padding: 0;
            border-radius: 8px;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .field-label {
            display: block;
            margin-bottom: 8px;
            color: #bb86fc;
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
        }
        .converter-input {
            text-align: right;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .converter-result {
            background: #2c2c2c;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            border: 1px solid #333;
        }
        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #bb86fc;
            text-align: center;
            margin: 10px 0;
        }
        .result-label {
            text-align: center;
            color: #e0e0e0;
            opacity: 0.8;
        }
        .formula {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 14px;
            color: #aaa;
        }
        .intermediate-result {
            color: #7c4dff;
            font-weight: bold;
        }
        .swap-button-container {
            text-align: center;
            margin: 5px 0 15px 0;
        }
        .swap-button {
            background: #7c4dff;
            color: #121212;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .swap-button:hover {
            background: #6a3dff;
        }
        .swap-icon {
            font-size: 16px;
        }
        .deal-forbidden {
            text-align: center;
            padding: 20px;
            border: 2px solid #ff4444;
            border-radius: 4px;
            background: rgba(255, 68, 68, 0.1);
            margin-top: 20px;
        }
        .deal-forbidden-text {
            color: #ff4444;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 15px;
            }
            .tabs {
                flex-direction: column;
                align-items: stretch;
            }
            .tab {
                text-align: center;
            }
            .output-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .output-item strong {
                margin-bottom: 5px;
            }
            .deal-forbidden-text {
                font-size: 16px;
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="el__logo"><a href="index.html"><img src="min_logo.png" /></a></div>
        <div class="tabs">
            <div class="tab active" data-target="structures-tab">Структуры</div>
            <div class="tab" data-target="multipliers-tab">Множитель за 1 элемент</div>
            <div class="tab" data-target="converter-tab">Конвертер ресурсов</div>
        </div>

        <div id="structures-tab" class="content active">
            <div class="searchable">
                <input type="text" id="search-input" placeholder="Фильтр списка структур">
                <select id="structure-select">
                    <option value="">Выберите структуру...</option>
                </select>
            </div>
            <div id="output" class="output" style="display: none;"></div>
        </div>

        <div id="multipliers-tab" class="content">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Название ресурс</th><th>Множитель за 1 элемент</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="converter-tab" class="content">
            <div class="searchable">
                <div class="form-group">
                    <label class="field-label">Исходный ресурс</label>
                    <select id="from-resource"><option value="">Выберите исходный ресурс...</option></select>
                </div>
                <div class="swap-button-container">
                    <button class="swap-button" id="swap-resources"><span class="swap-icon">↕</span> Поменять местами</button>
                </div>
                <div class="form-group">
                    <label class="field-label">Целевой ресурс</label>
                    <select id="to-resource"><option value="">Выберите целевой ресурс...</option></select>
                </div>
                <div class="form-group">
                    <label class="field-label">Количество исходного ресурса</label>
                    <input type="text" id="resource-amount" class="converter-input" placeholder="0" value="1">
                </div>
            </div>
            <div class="converter-result" id="conversion-result" style="display: none;"></div>
            <div class="deal-forbidden" id="deal-forbidden" style="display: none;">
                <p class="deal-forbidden-text">Сделка запрещена правилами проекта</p>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="script_struct.js?v=1.0.1"></script>
</body>
</html>
